name: Build and Release Windows EXE

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.0.0)'
        required: false
        default: '1.0.0'

permissions:
  contents: write

jobs:
  build-windows-exe:
    name: Package Windows EXE
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'

      - name: Build Fat JAR with Maven
        run: mvn clean package -DskipTests

      - name: Determine Version
        id: get_version
        shell: bash
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          elif [[ -n "${{ github.event.inputs.version }}" ]]; then
            VERSION="${{ github.event.inputs.version }}"
          else
            VERSION="1.0.0"
          fi
          # Ensure semver format X.Y.Z for jpackage
          if [[ ! "$VERSION" =~ ^[0-9]+(\.[0-9]+)*$ ]]; then
            VERSION="1.0.0"
          fi
          echo "APP_VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "Building version: $VERSION"

      - name: Package Windows .exe with jpackage
        shell: pwsh
        run: |
          mkdir dist
          jpackage --type exe `
                   --name "TeeCeylon" `
                   --app-version "$env:APP_VERSION" `
                   --vendor "TeeCeylon" `
                   --description "TeeCeylon T-Shirt Shop POS & Inventory Management System" `
                   --input "target" `
                   --main-jar "Tee-CeylonStoreManagement-1.0-SNAPSHOT.jar" `
                   --main-class "org.example.AppLauncher" `
                   --win-dir-chooser `
                   --win-shortcut `
                   --win-menu `
                   --win-menu-group "TeeCeylon" `
                   --dest "dist"
          
          Get-ChildItem -Path dist

      - name: Upload Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: TeeCeylon-Windows-Installer
          path: dist/*.exe
          if-no-files-found: error

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name || format('v{0}', env.APP_VERSION) }}
          name: Release ${{ github.ref_name || format('v{0}', env.APP_VERSION) }}
          draft: false
          prerelease: false
          files: dist/*.exe
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
