# ===================================================================
# TeeCeylon Application Configuration
# ===================================================================

# -------------------------------------------------------------------
# Database Configuration
# -------------------------------------------------------------------
# Local MySQL (Default):
db.url=jdbc:mysql://localhost:3306/Tee-Ceylon?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true
db.user=root
db.password=12345
db.driver=com.mysql.cj.jdbc.Driver
db.dialect=org.hibernate.dialect.MySQL8Dialect
db.hbm2ddl.auto=update
db.show_sql=false

# -------------------------------------------------------------------
# Aiven Cloud MySQL Example (Uncomment & replace with your Aiven URI or set via ENV):
# Environment variables supported: AIVEN_MYSQL_URL, DATABASE_URL, DB_URL, DB_USER, DB_PASSWORD
# -------------------------------------------------------------------
# db.url=jdbc:mysql://<AIVEN_HOST>:<AIVEN_PORT>/defaultdb?sslMode=REQUIRED&allowPublicKeyRetrieval=true
# db.user=avnadmin
# db.password=<AIVEN_PASSWORD>

# -------------------------------------------------------------------
# Email Configuration (Optional - for order invoice / OTP dispatch)
# -------------------------------------------------------------------
mail.smtp.host=smtp.gmail.com
mail.smtp.port=587
mail.smtp.auth=true
mail.smtp.starttls.enable=true
mail.sender.email=
mail.sender.password=
